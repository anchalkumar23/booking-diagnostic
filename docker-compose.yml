services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: booking_diagnostic
    ports:
      - "5433:5432"  # host 5433 -> avoids clashing with a locally-installed Postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/booking_diagnostic
      # JWT_SECRET intentionally left unset here: the app auto-generates a
      # random one at startup when it's missing. Set your own via a .env
      # file (docker compose reads it automatically) for a stable secret
      # across restarts, e.g. in real deployments.
      WEBHOOK_SECRET: local-dev-webhook-secret
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
